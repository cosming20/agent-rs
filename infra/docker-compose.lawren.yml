# ============================================================
# Lawren Crawler — PostgreSQL for imported dump
# ============================================================
# Standalone compose file. Does not share network/volumes with
# the main agentic-rag stack.
#
# Usage:
#   docker compose -p lawren -f infra/docker-compose.lawren.yml up -d
#
# Import dump (after container is healthy):
#   zstd -d --stdout lawren_crawler_dump.sql.zst | \
#     docker exec -i lawren-crawler-postgres psql -U lawren -d lawren_crawler
# ============================================================

name: lawren

volumes:
  lawren_postgres_data:

services:
  postgres:
    image: postgres:17.4
    container_name: lawren-crawler-postgres
    restart: "on-failure:5"
    ports:
      - "1070:5432"
    volumes:
      - lawren_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: lawren
      POSTGRES_PASSWORD: lawren
      POSTGRES_DB: lawren_crawler
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawren -d lawren_crawler"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
