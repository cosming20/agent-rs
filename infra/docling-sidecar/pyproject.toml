[project]
name = "docling-sidecar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "docling==2.86.*",
    "docling-core==2.73.*",
    "grpcio==1.68.*",
    "grpcio-tools==1.68.*",
    "grpcio-health-checking==1.68.*",
    "grpcio-reflection==1.68.*",
    "protobuf==5.*",
    "tiktoken>=0.7",
    "blake3>=1.0",
]

[project.scripts]
docling-sidecar = "docling_sidecar.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
