syntax = "proto3";

package agentic_rag.v1;

/// Health check service for liveness and readiness probes.
service HealthService {
  /// Check whether the server is currently serving requests.
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}

/// Request for a health check (no fields required).
message HealthCheckRequest {}

/// Response indicating the current serving status of the server.
message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  ServingStatus status = 1;
}
