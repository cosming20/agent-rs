[project]
name = "agentic-ra"
version = "0.1.0"
description = "Near-perfect agentic RAG system built on Haystack + Hayhooks"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "haystack-ai>=2.13",
    "httpx>=0.28",
    "mcp>=1.12",
    "opensearch-py[async]>=2.8",
    "pydantic-settings>=2.9",
    "qdrant-client>=1.13",
    "opentelemetry-api>=1.29",
    "opentelemetry-exporter-otlp>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-sdk>=1.29",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_ra"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.7",
]
