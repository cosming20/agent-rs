[project]
name = "agentic-ra"
version = "0.1.0"
description = "Near-perfect agentic RAG system built on Haystack + Hayhooks"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_ra"]
