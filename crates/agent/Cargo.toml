[package]
name = "agent-rs-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Agent orchestration: pipeline steps, verification, synthesis, memory."

[dependencies]
agent-rs-core          = { workspace = true }
agent-rs-stores        = { workspace = true }
agent-rs-retrieval     = { workspace = true }
agent-rs-tools         = { workspace = true }
agent-rs-observability = { workspace = true }

# LLM agent
rig-core = { workspace = true }

# Async
tokio       = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde      = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Common types
uuid   = { workspace = true }
chrono = { workspace = true }

# Citation extraction
regex = { workspace = true }

# HTTP client (shared across web tools)
reqwest = { workspace = true }

# Language detection (drives prompt routing + lang-aware tokenization).
whatlang = "0.18"

# Unicode word segmentation for the lang-agnostic heuristic verifier.
unicode-segmentation = "1.13"

# JSON schema derivation for `prompt_typed::<T>` (rig's structured
# outputs). Pinned to the same version rig-core 0.34 uses internally
# so the two `JsonSchema` derive macros never disagree.
schemars = "1.0.4"
