[package]
name = "agent-rs-retrieval"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Retrieval engine: embedding, search strategies, routing, and ranking."

[features]
# Include the legacy pdf-extract ingestion backend.
# Enabled by default to preserve backward compatibility.
# Disable with `--no-default-features` to produce a binary that only
# supports the Docling sidecar path.
default = ["legacy_pdf_extract"]
legacy_pdf_extract = ["dep:pdf-extract"]

[dependencies]
agent-rs-core          = { workspace = true }
agent-rs-stores        = { workspace = true }
agent-rs-observability = { workspace = true }

# Embeddings (ONNX local inference)
fastembed = "5"

# CPU-bound batch parallelism
rayon = { workspace = true }

# Async
tokio       = { workspace = true }
async-trait = { workspace = true }

# Logging
tracing = { workspace = true }

# Serialization
serde      = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# HTTP client (OpenAI embeddings API)
reqwest = { workspace = true }

# Retry with backoff (rate-limit handling)
backon = { workspace = true }

# Tokenisation (cl100k_base — used by text-embedding-3-large; token-aware chunking)
tiktoken-rs = { workspace = true }

# UUIDs (chunk IDs, deterministic ingest IDs)
uuid = { workspace = true, features = ["v5", "v4"] }

# Regex (section detection, entity extraction, metadata)
regex = { workspace = true }

# Timestamps (ingestion duration)
chrono = { workspace = true }

# PDF text extraction (optional — gated behind legacy_pdf_extract feature)
pdf-extract = { workspace = true, optional = true }

# Hashing — document SHA-256 for dedup + blake3 for chunk IDs
sha2   = { workspace = true }
blake3 = { workspace = true }

# Unicode NFC normalisation for weighted-keyword term hygiene.
unicode-normalization = "0.1"

# gRPC — Docling sidecar client (generated by build.rs via tonic-prost-build)
tonic        = "0.14"
tonic-prost  = "0.14"
prost        = "0.14"
tokio-stream = "0.1"

[build-dependencies]
# Protobuf code generation for the Docling sidecar gRPC client
tonic-prost-build = "0.14"

[dev-dependencies]
# Unicode normalisation for the prompt-snapshot bias guard (Layer 2)
unicode-normalization = "0.1"
# Cross-crate access for snapshot tests over agent-rs-agent prompts
agent-rs-agent = { path = "../agent" }
# Mock HTTP server for WeightedKeywordExtractor integration tests
mockito = "1"
# Property-based tests (weighted_bm25_query, adjust_for_weighted_keywords invariants)
proptest = "1"
