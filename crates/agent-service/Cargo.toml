[package]
name = "agent-rs-agent-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The crate builds a single binary that runs the tonic gRPC server
# exposing the Agent service. Consumers (agent-rs-web) link against
# the generated client code via their own tonic-build invocation
# against the same proto submodule; no shared library is needed.
[[bin]]
name = "agent-service"
path = "src/main.rs"

# Indexer worker — a separate long-running process that consumes the
# RabbitMQ index queue and runs the document-indexing pipeline
# (AgentIndexHandler). docker-compose runs one or more replicas.
[[bin]]
name = "indexer-worker"
path = "src/bin/indexer-worker.rs"

[dependencies]
# gRPC + codegen runtime
tonic     = "0.12"
prost     = "0.13"
# Use google.protobuf.Empty etc. if a future RPC needs it — currently
# every response has a bespoke message so prost-types is unused; keep
# the dep out of the build graph to cut compile time.

# Async
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"
tower = { version = "0.5", features = ["limit", "timeout", "load-shed"] }

# Observability — reuse the workspace tracing stack
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Configuration / errors
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }

# Value types (UserId, SessionId validator live here)
agent-rs-core = { path = "../core" }

# Stores (PgStore, Neo4jStore, QdrantStore, MinioStore)
agent-rs-stores = { path = "../stores" }

# Agent orchestrator (AgentOrchestrator::process_query)
agent-rs-agent = { path = "../agent" }

# Retrieval router (used by orchestrator internally; re-imported here
# only if the service constructs its own router outside the agent — not
# expected, but kept for symmetry with the existing bin targets)
agent-rs-retrieval = { path = "../retrieval" }

# Tools — needed for the ToolFactory; AgentOrchestrator needs a tool set
agent-rs-tools = { path = "../tools" }

# Observability registry (metrics / tracing init)
agent-rs-observability = { path = "../observability" }

# RabbitMQ publisher / consumer for the indexing pipeline
agent-rs-queue = { path = "../queue" }

# PDF text extraction for the IndexerWorker's MVP indexing pipeline.
# Lightweight alternative to the Docling sidecar — used while Docling is
# unavailable or for simple text-only PDFs.
pdf-extract = { workspace = true }

# Shared HTTP client for the optional LLM stages (summarizer, KG
# extractor). Pinned to rustls-TLS to match the workspace default.
reqwest = { workspace = true }

# Serde helpers for chunk payloads.
serde_json = { workspace = true }
async-trait = { workspace = true }

# Workspace root: provides connect_stores, build_ingestion_pipeline,
# build_router, build_embedder, IngestFeatures, RouterFeatures, and the
# canonical Stores struct. No circular dependency — the root does not
# depend on agent-rs-agent-service.
agent-rs = { path = "../.." }

# Hashing — SHA-256 for document_id derivation (same as examples/ingest.rs)
sha2 = { workspace = true }

uuid = { workspace = true }
chrono = { workspace = true }

[build-dependencies]
# tonic-build compiles the proto from the submodule into OUT_DIR.
tonic-build = "0.12"
