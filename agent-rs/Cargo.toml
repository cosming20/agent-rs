[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/stores",
    "crates/retrieval",
    "crates/agent",
    "crates/tools",
    "crates/observability",
    "crates/server",
]

[package]
name = "agent-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Agentic RAG system -- gRPC server with LLM agents, retrieval, and tools."

[[bin]]
name = "agent-rs"
path = "src/main.rs"

[[example]]
name = "e2e_full_trace"
path = "examples/e2e_full_trace.rs"

[[example]]
name = "e2e_legal_qa"
path = "examples/e2e_legal_qa.rs"

[dependencies]
agent-rs-core          = { path = "crates/core" }
agent-rs-stores        = { path = "crates/stores" }
agent-rs-retrieval     = { path = "crates/retrieval" }
agent-rs-agent         = { path = "crates/agent" }
agent-rs-tools         = { path = "crates/tools" }
agent-rs-observability = { path = "crates/observability" }
agent-rs-server        = { path = "crates/server" }
tokio      = { version = "1", features = ["full"] }
anyhow     = "1"
tracing    = "0.1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
uuid       = { version = "1", features = ["v4", "serde"] }
chrono     = { version = "0.4", features = ["serde"] }
pdf-extract = "0.7"
regex      = "1"
qdrant-client = "1"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# CPU-bound parallelism
rayon = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.29"

# OpenTelemetry
opentelemetry = { version = "0.28", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.28", features = ["trace", "metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.28", features = ["trace", "metrics", "grpc-tonic"] }
opentelemetry-semantic-conventions = "0.28"

# Config
figment = { version = "0.10", features = ["env", "toml"] }
dotenvy = "0.15"

# Database - Diesel
diesel = { version = "2.2", features = ["postgres", "chrono", "uuid", "serde_json"] }
diesel-async = { version = "0.5", features = ["postgres", "bb8"] }

# Vector DB
qdrant-client = "1"

# Graph DB
neo4rs = { version = "0.8", features = ["json"] }

# Common types
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# LLM agent framework
rig-core = { version = "0.34", features = ["derive"] }

# Regex (citation extraction)
regex = "1"

# Workspace crates
agent-rs-core = { path = "crates/core" }
agent-rs-stores = { path = "crates/stores" }
agent-rs-retrieval = { path = "crates/retrieval" }
agent-rs-agent = { path = "crates/agent" }
agent-rs-tools = { path = "crates/tools" }
agent-rs-observability = { path = "crates/observability" }
agent-rs-server = { path = "crates/server" }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# PDF text extraction
pdf-extract = "0.7"

# Retry with backoff
backon = "1"
